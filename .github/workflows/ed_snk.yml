name: 部署到 GitHub Pages

# 1) 明確開啟寫入權限，讓 GITHUB_TOKEN 可以推送
permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main     # 當推送到 main 分支時觸發

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 2) 先把程式碼拉下來
      - name: 1) Checkout 程式碼
        uses: actions/checkout@v3
        with:
          # persist-credentials 預設為 true，可讀寫后續推送
          persist-credentials: true

      # 3) 安裝相依並產生靜態檔案
      - name: 2) 安裝並建置
        run: |
          npm ci
          npm run build

      # 4) 推送到 GitHub Pages
      - name: 3) 部署到 GitHub Pages
        uses: crazy-max/ghaction-github-pages@v2.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist        # 請視專案實際輸出資料夾調整
          # pages_branch: output     # 如要改推到非預設分支，可解除註解並指定
