name: Medium RSS → README
on:
  workflow_dispatch:      # 手動測
permissions:
  contents: write

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@renhehuang0723"
          max_post_count: 4
          template: |
            <!-- BLOG-POST-LIST:START -->
            <table><tr>$posts</tr></table>
            <!-- BLOG-POST-LIST:END -->
          itemTemplate: |
            <td align="center" width="25%">
              <a href="$url" target="_blank">
                <img src="$banner" width="200" style="border-radius:12px"/><br/>
                <sub>📝 $title</sub><br/>
                <sub>📅 $date</sub>
              </a>
            </td>
