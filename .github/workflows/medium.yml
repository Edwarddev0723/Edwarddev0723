name: Update recent Medium posts

on:
  schedule:
    - cron: '0 11 * * *'          # 每日 19:00 (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://rss.app/feeds/wzKzVkFIhLfE3ytS.xml"
          max_post_count: 4
          date_format: "yyyy-MM-dd"

          # ① 把 <media:thumbnail url="..."/> 映射成 $thumb
          custom_tags: "thumb/media:thumbnail/"

          # ② 每篇文章的排版（無 item_exec）
          template: |
            <a href="$url" target="_blank" style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
              <img src="$thumb" width="80" style="border-radius:8px"/>
              <div>
                <b>$title</b><br/>
                <sub>📅 $date</sub>
              </div>
            </a>$newline
