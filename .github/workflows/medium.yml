name: Medium RSS → README
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@renhehuang0723"
          max_post_count: 4           # 顯示 4 篇
          template: |
            - [$title]($url)$newline  # 每篇一列，最保險
