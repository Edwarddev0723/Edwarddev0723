name: Medium RSS → README
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@renhehuang0723"
          max_post_count: 4
          date_format: "yyyy-mm-dd"
          template: |
            <a href="$url" target="_blank" style="display:inline-block;width:45%;margin:1%;">
              <strong>$title</strong><br/>
              <sub>📅 $date</sub>
            </a>$newline
