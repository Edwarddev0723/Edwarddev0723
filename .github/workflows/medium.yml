name: Update recent Medium posts

on:
  schedule:
    - cron: '0 11 * * *'      # 每日 19:00 (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README with latest Medium posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://rss.app/feeds/wzKzVkFIhLfE3ytS.xml"
          max_post_count: 4
          date_format: "yyyy-MM-dd"
          commit_message: "docs(readme): update recent Medium posts"
          template: |
            <!-- BLOG-POST-LIST:START -->
            <table><tr>$posts</tr></table>
            <!-- BLOG-POST-LIST:END -->
          item_exec: |
            echo "<td align=\"center\" width=\"25%\"><a href=\"$url\" target=\"_blank\"><img src=\"$banner\" width=\"200\" style=\"border-radius:12px\"/><br/><sub>📝 $title</sub><br/><sub>📅 $date</sub></a></td>"
          custom_tags: "media:thumbnail"
          disable_html_encoding: true
